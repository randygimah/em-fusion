# Alembic configuration. Spec: db-001.
#
# Autogenerate is deliberately not used: it does not understand PostGIS
# geometry columns and would emit a revision nobody has read. Revisions are
# written by hand.
#
# `sqlalchemy.url` is empty on purpose. env.py reads DATABASE_URL from the
# environment, and the test suite overrides the option to address a disposable
# database instead. A URL here would be a hardcoded DSN in a committed file,
# which NFR-401 forbids.

[alembic]
script_location = alembic
prepend_sys_path = .
# Explicit, because the legacy fallback (split on spaces, commas and colons)
# is deprecated and warns on every invocation.
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
