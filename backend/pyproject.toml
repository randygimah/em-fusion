[project]
name = "em-fusion-backend"
version = "0.1.0"
description = "ADS-B and synthetic RF anomaly monitoring and alerting system"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "fastapi",
    "psycopg[binary]",
    "pyarrow",
    "pydantic",
    "python-dotenv",
    "sqlalchemy",
    "uvicorn",
]

[dependency-groups]
dev = [
    "black",
    # starlette.testclient prefers httpx2 and warns on httpx. Both work; this
    # follows the direction starlette is moving rather than waiting for the
    # fallback to be removed.
    "httpx2",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

# The backend is an application, not a distributable package: uv installs the
# dependencies and the source is imported from the working directory. Without
# this, uv looks for a build backend that would exist only to serve itself.
[tool.uv]
package = false

# Tool configuration, all of it. ruff replaced flake8 and isort, which is what
# removed the last file that could not live here.

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes — the flake8 defaults. I is isort.
select = ["E", "F", "W", "I"]
# E203 (whitespace before punctuation) disagrees with black's slice formatting.
# W503 has no ruff equivalent; ruff does not implement line-break-before-operator
# as a lint at all, so it needs no entry here.
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
# pyarrow ships neither stubs nor a py.typed marker.
module = "pyarrow.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
]
# `--strict-markers` means this list is the registry: an unregistered marker is
# an error rather than a silent typo that deselects nothing.
filterwarnings = [
    # SQLAlchemy does not know the PostGIS `geometry` type, because GeoAlchemy2
    # is deliberately not a dependency yet -- `db-001` writes its geometry
    # columns as explicit DDL, and the library earns its place at query time in
    # `db-003`. Until then every table inspection warns once per column. Remove
    # this line when GeoAlchemy2 lands; if it stops matching, the reason it
    # existed has gone.
    "ignore:Did not recognize type 'geometry':sqlalchemy.exc.SAWarning",
]
markers = [
    "database: needs a live PostgreSQL with PostGIS. Skipped when TEST_DATABASE_URL is unset, which is what keeps the unit suite runnable with no Docker (db-005).",
]
