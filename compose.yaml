name: em-fusion

services:
  postgis:
    container_name: em-fusion-postgis
    image: postgis/postgis:15-3.5-alpine
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-em_fusion}
    # Overridable, because 5432 is often already taken by a native Postgres install.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}", "-d", "${POSTGRES_DB:-em_fusion}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Replay / synthetic-observation pipeline. Profiled so it never starts as part
  # of `docker compose up` — it is a one-shot job, driven by `make generate`.
  pipeline:
    profiles: ["pipeline"]
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.pipeline"]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgis:5432/em_fusion}
      # Passed through from the host with no default of any kind. A committed
      # default would be a published reverse mapping -- an icao24 is a 24-bit
      # space, so seed plus source reconstructs every pseudonym by exhaustive
      # search (dal-004, docs/qa.md 37).
      #
      # Deliberately NOT the `${VAR:?}` required form, which adp-007 originally
      # specified. Compose interpolates the whole file for every command
      # regardless of profile, so a required variable here makes `up`,
      # `migrate`, `test` and `demo` all demand a seed that only `replay`
      # needs -- and `make demo` on a clean machine is AC-12. The loud failure
      # is kept where it belongs instead: Pseudonymiser.from_environment
      # raises before anything is written, naming backend/.env.example, and
      # app/replay.py loads backend/.env so the ordinary path needs no export.
      PSEUDONYM_SEED: ${PSEUDONYM_SEED}
    volumes:
      - ./backend:/app
      - ./data:/data

  backend:
    container_name: em-fusion-backend
    build:
      context: ./backend
      target: dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgis:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The host name is the compose service, not localhost. Nothing reads this yet;
    # it is here so the first repository lands against a working connection string.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@postgis:5432/em_fusion}
      # Passed through from the host with no default of any kind. A committed
      # default would be a published reverse mapping -- an icao24 is a 24-bit
      # space, so seed plus source reconstructs every pseudonym by exhaustive
      # search (dal-004, docs/qa.md 37).
      #
      # Deliberately NOT the `${VAR:?}` required form, which adp-007 originally
      # specified. Compose interpolates the whole file for every command
      # regardless of profile, so a required variable here makes `up`,
      # `migrate`, `test` and `demo` all demand a seed that only `replay`
      # needs -- and `make demo` on a clean machine is AC-12. The loud failure
      # is kept where it belongs instead: Pseudonymiser.from_environment
      # raises before anything is written, naming backend/.env.example, and
      # app/replay.py loads backend/.env so the ordinary path needs no export.
      PSEUDONYM_SEED: ${PSEUDONYM_SEED}
    volumes:
      - ./backend:/app
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    container_name: em-fusion-frontend
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    # nginx runs unprivileged and listens on 8080 inside the container.
    ports:
      - "8080:8080"
    healthcheck:
      # 127.0.0.1, not localhost. nginx declares `listen 8080;`, which binds
      # IPv4 only, and `localhost` inside this image resolves to ::1 first --
      # so the probe was refused while every real request was served, leaving
      # the container permanently unhealthy. A service that is always
      # unhealthy can never report *becoming* unhealthy (ops-001).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Vitest against the frontend build stage, which already has node_modules.
  # src/ is bind-mounted so a test run reflects the working tree, not the image.
  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      target: build
    command: ["pnpm", "test"]
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgis_data:
