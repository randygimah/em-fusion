<svg xmlns="http://www.w3.org/2000/svg" width="672" height="484" viewBox="-16 -16 672 484" role="img"
             aria-label="A three-step ladder. Step one: is there a radio anomaly at all? If no, the answer is a coverage failure. If yes, continue. Step two: is it confined to one receiver with its neighbours clean? If yes, the answer is broken equipment. If no, continue. Step three: are aircraft dropouts unusually frequent nearby? If yes, the answer is interference; if no, nothing is reported.">
<style>:root{--ground: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #e9edf5;
    --ink: #111620;
    --ink-2: #39424f;
    --muted: #67717f;
    --line: #d5dce6;
    --line-soft: #e6ebf2;

    --accent: #1f4fa8;
    --accent-soft: #e3ebfa;
    --signal: #0b6a7d;
    --signal-soft: #d9eef4;
    --ok: #146b52;
    --ok-soft: #dcefe7;
    --warn: #8a4b12;
    --warn-soft: #f8ead9;
    --bad: #a32b23;
    --bad-soft: #f8e4e2;

    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground: #0b0e15;
      --surface: #10131a;
      --surface-2: #191b23;
      --ink: #e1e2ec;
      --ink-2: #c2c6d6;
      --muted: #8c909f;
      --line: #2b3140;
      --line-soft: #1c2029;

      --accent: #adc6ff;
      --accent-soft: #182545;
      --signal: #4cd7f6;
      --signal-soft: #0d2b33;
      --ok: #6fd3a5;
      --ok-soft: #0f2a20;
      --warn: #ffb786;
      --warn-soft: #33210f;
      --bad: #ffb4ab;
      --bad-soft: #351714;}}
:root[data-theme="dark"]{--ground: #0b0e15;
    --surface: #10131a;
    --surface-2: #191b23;
    --ink: #e1e2ec;
    --ink-2: #c2c6d6;
    --muted: #8c909f;
    --line: #2b3140;
    --line-soft: #1c2029;

    --accent: #adc6ff;
    --accent-soft: #182545;
    --signal: #4cd7f6;
    --signal-soft: #0d2b33;
    --ok: #6fd3a5;
    --ok-soft: #0f2a20;
    --warn: #ffb786;
    --warn-soft: #33210f;
    --bad: #ffb4ab;
    --bad-soft: #351714;}
.fig__art{overflow-x: auto; line-height: 0;}
.fig__art img{display: block; width: 100%; border-radius: 4px; border: 1px solid var(--line);}
.fig__art svg{display: block;}
.fig__label{font-family: var(--display);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    fill: var(--muted);}
.fig__tick{font-family: var(--mono); font-size: 10.5px;}
.fig__tick:not([fill]){fill: var(--muted);}
.fig__place{font-family: var(--display); font-size: 11.5px; font-weight: 500; fill: var(--ink-2);}
.fig__val{font-family: var(--mono); font-size: 11.5px;}
.fig__val:not([fill]){fill: var(--ink);}
.fig-bg{fill:var(--surface);stroke:var(--line)}</style>
<rect class="fig-bg" x="-15.5" y="-15.5" width="671" height="483" rx="8"/>

          <text class="fig__label" x="4" y="14">One decision, asked in a fixed order</text>

          <!-- step 1 -->
          <circle cx="24" cy="48" r="13" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
          <text class="fig__val" x="24" y="52" text-anchor="middle" style="fill:var(--accent)">1</text>
          <text class="fig__place" x="48" y="44">Is there a radio anomaly at all?</text>
          <text class="fig__tick" x="48" y="62">the aircraft side is not consulted</text>
          <line x1="48" y1="80" x2="352" y2="80" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" />
          <polygon points="352,76 362,80 352,84" fill="var(--line)" />
          <text class="fig__val" x="56" y="74">no</text>
          <rect x="368" y="62" width="250" height="36" rx="4" fill="var(--signal-soft)" stroke="var(--signal)" stroke-width="1.5" />
          <text class="fig__place" x="384" y="85" style="fill:var(--signal)">We are not hearing aircraft here</text>
          <line x1="24" y1="66" x2="24" y2="150" stroke="var(--accent)" stroke-width="1.5" />
          <polygon points="20,150 24,160 28,150" fill="var(--accent)" />
          <text class="fig__val" x="34" y="120">yes</text>

          <!-- step 2 -->
          <circle cx="24" cy="188" r="13" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
          <text class="fig__val" x="24" y="192" text-anchor="middle" style="fill:var(--accent)">2</text>
          <text class="fig__place" x="48" y="184">One receiver only, its neighbours clean?</text>
          <text class="fig__tick" x="48" y="202">still only the radio side</text>
          <line x1="48" y1="220" x2="352" y2="220" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" />
          <polygon points="352,216 362,220 352,224" fill="var(--line)" />
          <text class="fig__val" x="56" y="214">yes</text>
          <rect x="368" y="202" width="250" height="36" rx="4" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5" />
          <text class="fig__place" x="384" y="225" style="fill:var(--warn)">That receiver is broken</text>
          <line x1="24" y1="206" x2="24" y2="290" stroke="var(--accent)" stroke-width="1.5" />
          <polygon points="20,290 24,300 28,290" fill="var(--accent)" />
          <text class="fig__val" x="34" y="260">no</text>

          <!-- step 3 -->
          <circle cx="24" cy="328" r="13" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" />
          <text class="fig__val" x="24" y="332" text-anchor="middle" style="fill:var(--accent)">3</text>
          <text class="fig__place" x="48" y="324">Aircraft dropouts unusually frequent nearby?</text>
          <text class="fig__tick" x="48" y="342">the only step that uses the aircraft side</text>
          <line x1="48" y1="360" x2="352" y2="360" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" />
          <polygon points="352,356 362,360 352,364" fill="var(--line)" />
          <text class="fig__val" x="56" y="354">yes</text>
          <rect x="368" y="342" width="250" height="36" rx="4" fill="var(--bad-soft)" stroke="var(--bad)" stroke-width="1.5" />
          <text class="fig__place" x="384" y="365" style="fill:var(--bad)">Something is interfering here</text>

          <line x1="24" y1="346" x2="24" y2="410" stroke="var(--line)" stroke-width="1.5" />
          <line x1="24" y1="410" x2="352" y2="410" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" />
          <polygon points="352,406 362,410 352,414" fill="var(--line)" />
          <text class="fig__val" x="34" y="404">no</text>
          <rect x="368" y="392" width="250" height="36" rx="4" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="4 3" />
          <text class="fig__place" x="384" y="415" style="fill:var(--muted)">Nothing worth reporting</text>
        </svg>
