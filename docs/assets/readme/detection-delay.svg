<svg xmlns="http://www.w3.org/2000/svg" width="672" height="270" viewBox="-16 -16 672 270" role="img"
             aria-label="Delay per kind of hour, in seconds. All three run from ten seconds to ninety. The median is ten seconds for one broken receiver and for mixed evidence, and twenty seconds for interference. Below ten seconds is a forbidden region: no rule acts on evidence that short.">
<style>:root{--ground: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #e9edf5;
    --ink: #111620;
    --ink-2: #39424f;
    --muted: #67717f;
    --line: #d5dce6;
    --line-soft: #e6ebf2;

    --accent: #1f4fa8;
    --accent-soft: #e3ebfa;
    --signal: #0b6a7d;
    --signal-soft: #d9eef4;
    --ok: #146b52;
    --ok-soft: #dcefe7;
    --warn: #8a4b12;
    --warn-soft: #f8ead9;
    --bad: #a32b23;
    --bad-soft: #f8e4e2;

    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground: #0b0e15;
      --surface: #10131a;
      --surface-2: #191b23;
      --ink: #e1e2ec;
      --ink-2: #c2c6d6;
      --muted: #8c909f;
      --line: #2b3140;
      --line-soft: #1c2029;

      --accent: #adc6ff;
      --accent-soft: #182545;
      --signal: #4cd7f6;
      --signal-soft: #0d2b33;
      --ok: #6fd3a5;
      --ok-soft: #0f2a20;
      --warn: #ffb786;
      --warn-soft: #33210f;
      --bad: #ffb4ab;
      --bad-soft: #351714;}}
:root[data-theme="dark"]{--ground: #0b0e15;
    --surface: #10131a;
    --surface-2: #191b23;
    --ink: #e1e2ec;
    --ink-2: #c2c6d6;
    --muted: #8c909f;
    --line: #2b3140;
    --line-soft: #1c2029;

    --accent: #adc6ff;
    --accent-soft: #182545;
    --signal: #4cd7f6;
    --signal-soft: #0d2b33;
    --ok: #6fd3a5;
    --ok-soft: #0f2a20;
    --warn: #ffb786;
    --warn-soft: #33210f;
    --bad: #ffb4ab;
    --bad-soft: #351714;}
.fig__art{overflow-x: auto; line-height: 0;}
.fig__art img{display: block; width: 100%; border-radius: 4px; border: 1px solid var(--line);}
.fig__art svg{display: block;}
.fig__label{font-family: var(--display);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    fill: var(--muted);}
.fig__tick{font-family: var(--mono); font-size: 10.5px;}
.fig__tick:not([fill]){fill: var(--muted);}
.fig__place{font-family: var(--display); font-size: 11.5px; font-weight: 500; fill: var(--ink-2);}
.fig__val{font-family: var(--mono); font-size: 11.5px;}
.fig__val:not([fill]){fill: var(--ink);}
.fig-bg{fill:var(--surface);stroke:var(--line)}</style>
<rect class="fig-bg" x="-15.5" y="-15.5" width="671" height="269" rx="8"/>
          <rect x="210" y="34" width="38" height="152" fill="var(--muted)" opacity="0.13" />
          <line x1="248" y1="34" x2="248" y2="190" stroke="var(--accent)" stroke-width="1.5"
                stroke-dasharray="4 3" />
          <text class="fig__label" x="8" y="18">nothing can be known faster than the floor</text>
          <text class="fig__val" x="254" y="45" fill="var(--accent)">10 s floor</text>

          <text class="fig__val" x="8" y="62">One broken receiver</text>
          <rect x="248" y="50" width="304" height="14" rx="7" fill="var(--signal)" opacity="0.22" />
          <circle cx="248" cy="57" r="6" fill="var(--signal)" stroke="var(--surface)" stroke-width="1.5" />
          <text class="fig__val" x="634" y="62" text-anchor="end" fill="var(--signal)">10 s</text>

          <text class="fig__val" x="8" y="106">Mixed evidence</text>
          <rect x="248" y="94" width="304" height="14" rx="7" fill="var(--signal)" opacity="0.22" />
          <circle cx="248" cy="101" r="6" fill="var(--signal)" stroke="var(--surface)" stroke-width="1.5" />
          <text class="fig__val" x="634" y="106" text-anchor="end" fill="var(--signal)">10 s</text>

          <text class="fig__val" x="8" y="150">Interference</text>
          <rect x="248" y="138" width="304" height="14" rx="7" fill="var(--signal)" opacity="0.22" />
          <circle cx="286" cy="145" r="6" fill="var(--warn)" stroke="var(--surface)" stroke-width="1.5" />
          <text class="fig__val" x="634" y="150" text-anchor="end" fill="var(--warn)">20 s</text>

          <line x1="210" y1="186" x2="590" y2="186" stroke="var(--line)" stroke-width="1" />
          <text class="fig__val" x="210" y="204" text-anchor="middle" fill="var(--muted)">0</text>
          <text class="fig__val" x="305" y="204" text-anchor="middle" fill="var(--muted)">25</text>
          <text class="fig__val" x="400" y="204" text-anchor="middle" fill="var(--muted)">50</text>
          <text class="fig__val" x="495" y="204" text-anchor="middle" fill="var(--muted)">75</text>
          <text class="fig__val" x="590" y="204" text-anchor="middle" fill="var(--muted)">100 s</text>

          <rect x="8" y="222" width="11" height="11" rx="2" fill="var(--signal)" opacity="0.22" />
          <text class="fig__val" x="26" y="232">fastest to slowest over 60 hours</text>
          <circle cx="318" cy="228" r="5" fill="var(--signal)" />
          <text class="fig__val" x="330" y="232">median</text>
        </svg>
