<svg xmlns="http://www.w3.org/2000/svg" width="672" height="308" viewBox="-16 -16 672 308" role="img"
             aria-label="Recall counted two ways on the three kinds of hour that stage aircraft. Per hour: interference 1.000, mixed evidence 1.000, aircraft coverage gap not applicable. Per disrupted aircraft: interference 0.823, mixed evidence 0.587, aircraft coverage gap 0.587.">
<style>:root{--ground: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #e9edf5;
    --ink: #111620;
    --ink-2: #39424f;
    --muted: #67717f;
    --line: #d5dce6;
    --line-soft: #e6ebf2;

    --accent: #1f4fa8;
    --accent-soft: #e3ebfa;
    --signal: #0b6a7d;
    --signal-soft: #d9eef4;
    --ok: #146b52;
    --ok-soft: #dcefe7;
    --warn: #8a4b12;
    --warn-soft: #f8ead9;
    --bad: #a32b23;
    --bad-soft: #f8e4e2;

    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground: #0b0e15;
      --surface: #10131a;
      --surface-2: #191b23;
      --ink: #e1e2ec;
      --ink-2: #c2c6d6;
      --muted: #8c909f;
      --line: #2b3140;
      --line-soft: #1c2029;

      --accent: #adc6ff;
      --accent-soft: #182545;
      --signal: #4cd7f6;
      --signal-soft: #0d2b33;
      --ok: #6fd3a5;
      --ok-soft: #0f2a20;
      --warn: #ffb786;
      --warn-soft: #33210f;
      --bad: #ffb4ab;
      --bad-soft: #351714;}}
:root[data-theme="dark"]{--ground: #0b0e15;
    --surface: #10131a;
    --surface-2: #191b23;
    --ink: #e1e2ec;
    --ink-2: #c2c6d6;
    --muted: #8c909f;
    --line: #2b3140;
    --line-soft: #1c2029;

    --accent: #adc6ff;
    --accent-soft: #182545;
    --signal: #4cd7f6;
    --signal-soft: #0d2b33;
    --ok: #6fd3a5;
    --ok-soft: #0f2a20;
    --warn: #ffb786;
    --warn-soft: #33210f;
    --bad: #ffb4ab;
    --bad-soft: #351714;}
.fig__art{overflow-x: auto; line-height: 0;}
.fig__art img{display: block; width: 100%; border-radius: 4px; border: 1px solid var(--line);}
.fig__art svg{display: block;}
.fig__label{font-family: var(--display);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    fill: var(--muted);}
.fig__tick{font-family: var(--mono); font-size: 10.5px;}
.fig__tick:not([fill]){fill: var(--muted);}
.fig__place{font-family: var(--display); font-size: 11.5px; font-weight: 500; fill: var(--ink-2);}
.fig__val{font-family: var(--mono); font-size: 11.5px;}
.fig__val:not([fill]){fill: var(--ink);}
.fig-bg{fill:var(--surface);stroke:var(--line)}</style>
<rect class="fig-bg" x="-15.5" y="-15.5" width="671" height="307" rx="8"/>
          <text class="fig__label" x="8" y="16">the same three kinds of hour, counted two ways</text>

          <line x1="210" y1="32" x2="210" y2="216" stroke="var(--line)" stroke-width="1" />
          <line x1="590" y1="32" x2="590" y2="216" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" />

          <text class="fig__val" x="8" y="62">Interference</text>
          <rect x="210" y="40" width="380" height="16" rx="2" fill="var(--signal)" opacity="0.85" />
          <text class="fig__val" x="634" y="53" text-anchor="end" fill="var(--signal)">1.000</text>
          <rect x="210" y="62" width="313" height="16" rx="2" fill="var(--warn)" opacity="0.85" />
          <text class="fig__val" x="634" y="75" text-anchor="end" fill="var(--warn)">0.823</text>

          <text class="fig__val" x="8" y="128">Mixed evidence</text>
          <rect x="210" y="106" width="380" height="16" rx="2" fill="var(--signal)" opacity="0.85" />
          <text class="fig__val" x="634" y="119" text-anchor="end" fill="var(--signal)">1.000</text>
          <rect x="210" y="128" width="223" height="16" rx="2" fill="var(--warn)" opacity="0.85" />
          <text class="fig__val" x="634" y="141" text-anchor="end" fill="var(--warn)">0.587</text>

          <text class="fig__val" x="8" y="194">Aircraft coverage gap</text>
          <rect x="210" y="172" width="380" height="16" rx="2" fill="none" stroke="var(--line)"
                stroke-width="1" stroke-dasharray="4 4" />
          <text class="fig__val" x="634" y="185" text-anchor="end" fill="var(--muted)">no rule</text>
          <rect x="210" y="194" width="223" height="16" rx="2" fill="var(--warn)" opacity="0.85" />
          <text class="fig__val" x="634" y="207" text-anchor="end" fill="var(--warn)">0.587</text>

          <text class="fig__val" x="210" y="234" text-anchor="middle" fill="var(--muted)">0</text>
          <text class="fig__val" x="590" y="234" text-anchor="middle" fill="var(--muted)">1.0</text>

          <rect x="8" y="252" width="11" height="11" rx="2" fill="var(--signal)" opacity="0.85" />
          <text class="fig__val" x="26" y="262">per hour — did it name the right anomaly?</text>
          <rect x="330" y="252" width="11" height="11" rx="2" fill="var(--warn)" opacity="0.85" />
          <text class="fig__val" x="348" y="262">per aircraft — did it flag each one?</text>
        </svg>
