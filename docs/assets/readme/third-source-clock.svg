<svg xmlns="http://www.w3.org/2000/svg" width="672" height="172" viewBox="-16 -16 672 172" role="img"
             aria-label="The 17 minutes 14 seconds of active work on the third source, as one bar in three stretches where waits for a reply were cut out: a moment to commit the specification, five and a half minutes writing the tests and then the code, and eleven minutes in which the test suite finished and the work was marked done and committed. The test suite accounts for about 7 minutes of the total.">
<style>:root{--ground: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #e9edf5;
    --ink: #111620;
    --ink-2: #39424f;
    --muted: #67717f;
    --line: #d5dce6;
    --line-soft: #e6ebf2;

    --accent: #1f4fa8;
    --accent-soft: #e3ebfa;
    --signal: #0b6a7d;
    --signal-soft: #d9eef4;
    --ok: #146b52;
    --ok-soft: #dcefe7;
    --warn: #8a4b12;
    --warn-soft: #f8ead9;
    --bad: #a32b23;
    --bad-soft: #f8e4e2;

    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body: "Source Serif 4", Georgia, "Times New Roman", serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground: #0b0e15;
      --surface: #10131a;
      --surface-2: #191b23;
      --ink: #e1e2ec;
      --ink-2: #c2c6d6;
      --muted: #8c909f;
      --line: #2b3140;
      --line-soft: #1c2029;

      --accent: #adc6ff;
      --accent-soft: #182545;
      --signal: #4cd7f6;
      --signal-soft: #0d2b33;
      --ok: #6fd3a5;
      --ok-soft: #0f2a20;
      --warn: #ffb786;
      --warn-soft: #33210f;
      --bad: #ffb4ab;
      --bad-soft: #351714;}}
:root[data-theme="dark"]{--ground: #0b0e15;
    --surface: #10131a;
    --surface-2: #191b23;
    --ink: #e1e2ec;
    --ink-2: #c2c6d6;
    --muted: #8c909f;
    --line: #2b3140;
    --line-soft: #1c2029;

    --accent: #adc6ff;
    --accent-soft: #182545;
    --signal: #4cd7f6;
    --signal-soft: #0d2b33;
    --ok: #6fd3a5;
    --ok-soft: #0f2a20;
    --warn: #ffb786;
    --warn-soft: #33210f;
    --bad: #ffb4ab;
    --bad-soft: #351714;}
.fig__art{overflow-x: auto; line-height: 0;}
.fig__art img{display: block; width: 100%; border-radius: 4px; border: 1px solid var(--line);}
.fig__art svg{display: block;}
.fig__label{font-family: var(--display);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    fill: var(--muted);}
.fig__tick{font-family: var(--mono); font-size: 10.5px;}
.fig__tick:not([fill]){fill: var(--muted);}
.fig__place{font-family: var(--display); font-size: 11.5px; font-weight: 500; fill: var(--ink-2);}
.fig__val{font-family: var(--mono); font-size: 11.5px;}
.fig__val:not([fill]){fill: var(--ink);}
.fig-bg{fill:var(--surface);stroke:var(--line)}</style>
<rect class="fig-bg" x="-15.5" y="-15.5" width="671" height="171" rx="8"/>
          <text class="fig__label" x="20" y="24">Active time, 17 min 14 s, the waits for a reply cut out</text>
          <rect x="20" y="40" width="14.700000000000003" height="30" rx="2" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.2" />
          <rect x="37.7" y="40" width="188.5" height="30" rx="2" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.2" />
          <rect x="229.2" y="40" width="390.8" height="30" rx="2" fill="var(--ok-soft)" stroke="var(--ok)" stroke-width="1.2" />
          <text class="fig__val" x="131.95" y="60" text-anchor="middle">tests, then the code</text>
          <text class="fig__val" x="423.85" y="60" text-anchor="middle">suite finishes, marked done, committed</text>
          <rect x="203.9" y="78" width="239.70000000000002" height="7" rx="2" fill="var(--line)" />
          <text class="fig__val" x="443.6" y="100" text-anchor="end">test suite, about 7 min</text>
          <text class="fig__val" x="20" y="126" fill="var(--muted)">0</text>
          <text class="fig__val" x="194.1" y="126" text-anchor="middle" fill="var(--muted)">5 min</text>
          <text class="fig__val" x="368.2" y="126" text-anchor="middle" fill="var(--muted)">10 min</text>
          <text class="fig__val" x="620" y="126" text-anchor="end" fill="var(--muted)">17 min 14 s</text>
        </svg>
