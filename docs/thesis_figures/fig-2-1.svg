<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="EM Fusion's eight processing stages in a central column, with Endsley's levels of situation awareness bracketed on the left and the JDL data fusion levels bracketed on the right." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah21" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>

  <!-- column headers -->
  <text x="200" y="24" text-anchor="end" font-size="12.5" font-weight="bold" fill="#111111">Situation awareness</text>
  <text x="200" y="40" text-anchor="end" font-size="11" fill="#444444">(Endsley, 1995)</text>
  <text x="380" y="24" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111111">EM Fusion pipeline</text>
  <text x="560" y="24" text-anchor="start" font-size="12.5" font-weight="bold" fill="#111111">Data fusion levels</text>
  <text x="560" y="40" text-anchor="start" font-size="11" fill="#444444">(JDL model)</text>

  <!-- pipeline boxes -->
  <g stroke="#333333" stroke-width="1" fill="#ffffff">
    <rect x="230" y="56" width="300" height="40"/>
    <rect x="230" y="110" width="300" height="40"/>
    <rect x="230" y="164" width="300" height="40"/>
    <rect x="230" y="218" width="300" height="40"/>
    <rect x="230" y="272" width="300" height="40"/>
    <rect x="230" y="326" width="300" height="40"/>
    <rect x="230" y="380" width="300" height="40"/>
    <rect x="230" y="434" width="300" height="40" fill="#ececec"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="380" y="73" font-size="12.5" font-weight="bold">Sources</text>
    <text x="380" y="88" font-size="11" fill="#444444">OpenSky replay · synthetic RF · receiver health</text>
    <text x="380" y="127" font-size="12.5" font-weight="bold">Source adapters</text>
    <text x="380" y="142" font-size="11" fill="#444444">one per source; translate, never judge</text>
    <text x="380" y="181" font-size="12.5" font-weight="bold">Data Abstraction Layer</text>
    <text x="380" y="196" font-size="11" fill="#444444">validate · quarantine · provenance · pseudonymise</text>
    <text x="380" y="235" font-size="12.5" font-weight="bold">Store</text>
    <text x="380" y="250" font-size="11" fill="#444444">canonical observations in PostgreSQL + PostGIS</text>
    <text x="380" y="289" font-size="12.5" font-weight="bold">Baselines and rule ladder</text>
    <text x="380" y="304" font-size="11" fill="#444444">deterministic detection, stored as findings</text>
    <text x="380" y="343" font-size="12.5" font-weight="bold">Evidence bundles</text>
    <text x="380" y="358" font-size="11" fill="#444444">every citation resolves to a stored row</text>
    <text x="380" y="397" font-size="12.5" font-weight="bold">Hypothesis generation</text>
    <text x="380" y="412" font-size="11" fill="#444444">template or hosted model; schema and grounding checks</text>
    <text x="380" y="451" font-size="12.5" font-weight="bold">Analyst verdict</text>
    <text x="380" y="466" font-size="11" fill="#444444">confirm · reject · needs more evidence · false positive</text>
  </g>

  <!-- arrows between stages -->
  <g stroke="#333333" stroke-width="1.2" marker-end="url(#ah21)">
    <line x1="380" y1="96" x2="380" y2="109"/>
    <line x1="380" y1="150" x2="380" y2="163"/>
    <line x1="380" y1="204" x2="380" y2="217"/>
    <line x1="380" y1="258" x2="380" y2="271"/>
    <line x1="380" y1="312" x2="380" y2="325"/>
    <line x1="380" y1="366" x2="380" y2="379"/>
    <line x1="380" y1="420" x2="380" y2="433"/>
  </g>

  <!-- left brackets: Endsley -->
  <g fill="none" stroke="#555555" stroke-width="1.2">
    <path d="M222,58 H212 V256 H222"/>
    <path d="M222,274 H212 V418 H222"/>
    <path d="M222,436 H212 V472 H222" stroke-dasharray="4 3"/>
  </g>
  <g text-anchor="end" fill="#111111">
    <text x="200" y="152" font-size="12" font-weight="bold">Level 1</text>
    <text x="200" y="168" font-size="11.5">Perception</text>
    <text x="200" y="341" font-size="12" font-weight="bold">Level 2</text>
    <text x="200" y="357" font-size="11.5">Comprehension</text>
    <text x="200" y="449" font-size="12" font-weight="bold">Level 3</text>
    <text x="200" y="465" font-size="11.5">Projection, by the analyst</text>
  </g>

  <!-- right brackets: JDL -->
  <g fill="none" stroke="#555555" stroke-width="1.2">
    <path d="M538,58 H548 V148 H538"/>
    <path d="M538,166 H548 V256 H538"/>
    <path d="M538,274 H548 V418 H538"/>
    <path d="M538,436 H548 V472 H538"/>
  </g>
  <g text-anchor="start" fill="#111111">
    <text x="560" y="98" font-size="12" font-weight="bold">Level 0</text>
    <text x="560" y="114" font-size="11.5">Sub-object (signal) assessment</text>
    <text x="560" y="206" font-size="12" font-weight="bold">Level 1</text>
    <text x="560" y="222" font-size="11.5">Object assessment</text>
    <text x="560" y="341" font-size="12" font-weight="bold">Level 2</text>
    <text x="560" y="357" font-size="11.5">Situation assessment</text>
    <text x="560" y="449" font-size="12" font-weight="bold">Level 5</text>
    <text x="560" y="465" font-size="11.5">User refinement</text>
  </g>

  <!-- out of scope note -->
  <rect x="548" y="494" width="200" height="38" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="558" y="510" font-size="11" fill="#444444">Levels 3–4 (impact assessment,</text>
  <text x="558" y="525" font-size="11" fill="#444444">process refinement): out of scope</text>
</svg>
