<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Five stages in a row: readings, rules, claim, evidence package, explanation. Evaluation model 1 spans the rules and the claim and scores detection against the answer key. Evaluation model 2 spans the evidence package and the explanation and scores the hosted model against the template generator. A dashed line between the two evaluation models notes they are never scored against each other." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah31" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="240" fill="#ffffff"/>

  <!-- stages -->
  <g stroke="#333333" stroke-width="1" fill="#ffffff">
    <rect x="26" y="24" width="124" height="56"/>
    <rect x="172" y="24" width="124" height="56"/>
    <rect x="318" y="24" width="124" height="56"/>
    <rect x="464" y="24" width="124" height="56"/>
    <rect x="610" y="24" width="124" height="56"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="88" y="48" font-size="12.5" font-weight="bold">Readings</text>
    <text x="88" y="64" font-size="11" fill="#444444">aircraft and radio</text>
    <text x="234" y="48" font-size="12.5" font-weight="bold">Rules</text>
    <text x="234" y="64" font-size="11" fill="#444444">the only detector</text>
    <text x="380" y="48" font-size="12.5" font-weight="bold">Claim</text>
    <text x="380" y="64" font-size="11" fill="#444444">what the rules found</text>
    <text x="526" y="48" font-size="12.5" font-weight="bold">Evidence package</text>
    <text x="526" y="64" font-size="11" fill="#444444">what the model is given</text>
    <text x="672" y="48" font-size="12.5" font-weight="bold">Explanation</text>
    <text x="672" y="64" font-size="11" fill="#444444">AI model or template</text>
  </g>
  <g stroke="#333333" stroke-width="1.2" marker-end="url(#ah31)">
    <line x1="150" y1="52" x2="171" y2="52"/>
    <line x1="296" y1="52" x2="317" y2="52"/>
    <line x1="442" y1="52" x2="463" y2="52"/>
    <line x1="588" y1="52" x2="609" y2="52"/>
  </g>

  <!-- report card brackets -->
  <g fill="none" stroke="#555555" stroke-width="1.2">
    <path d="M172,92 V102 H442 V92"/>
    <path d="M464,92 V102 H734 V92"/>
  </g>
  <g text-anchor="middle" fill="#111111">
    <text x="307" y="124" font-size="12.5" font-weight="bold">Evaluation model 1: detection</text>
    <text x="307" y="141" font-size="11" fill="#333333">scored against the answer key</text>
    <text x="307" y="156" font-size="11" fill="#333333">recorded when the incident was staged</text>
    <text x="599" y="124" font-size="12.5" font-weight="bold">Evaluation model 2: explanation</text>
    <text x="599" y="141" font-size="11" fill="#333333">hosted AI model scored against the template</text>
    <text x="599" y="156" font-size="11" fill="#333333">generator, on the same evidence package</text>
  </g>

  <!-- never compared -->
  <path d="M307,168 V186 H599 V168" fill="none" stroke="#777777" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="453" y="208" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#111111">Rules and AI model are never scored against each other</text>
  <text x="453" y="225" text-anchor="middle" font-size="11" fill="#444444">the AI model sees no readings and makes no detection of its own</text>
</svg>
