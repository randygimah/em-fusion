<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 512" width="760" height="512" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Architecture of EM Fusion. The analyst uses a React dashboard, which reads map tiles from an offline archive and polls the API service for JSON. The API service is one Python process. Inside it, a scenario generator feeds source adapters, which pass records to the Data Abstraction Layer. The Data Abstraction Layer, baseline engine, anomaly engine, bundle builder, hypothesis service and routes all reach the observation store only through the repositories. The evaluation harness drives runs and campaigns. Two things sit outside EM Fusion: the archived OpenSky hour, read by the aviation adapter, and the hosted AI provider, called only by the hypothesis service." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah41" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
