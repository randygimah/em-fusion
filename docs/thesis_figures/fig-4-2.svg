<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" width="760" height="448" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="One OpenSky report mapped field by field into a canonical observation. Time becomes a UTC timestamp; latitude and longitude become one point; the aircraft address and callsign become keyed pseudonyms; altitude, speed, heading, climb rate and the on-ground flag are carried with units in their names; the two update times become two staleness values. Geometric altitude, squawk, alert and special-purpose flags are not carried. Six envelope fields have no source field and are added on the way in." xmlns:c2pa="http://c2pa.org/manifest">
