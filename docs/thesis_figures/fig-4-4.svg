<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two panels. Panel a: eight adjacent channels, each 2 MHz wide, centred from 1567.42 to 1581.42 MHz; channel 4 is centred on GPS L1 at 1575.42 MHz, with four channels below it and three above; channels 3 and 5 are its frequency neighbours. Panel b: the seven receivers on a schematic map, with lines joining pairs within 70 km of each other: Schiphol with Rotterdam and Lelystad; Eindhoven with Weeze; Weeze with Dusseldorf; Dusseldorf with Koln-Bonn. A dashed circle of 70 km is drawn around Weeze." xmlns:c2pa="http://c2pa.org/manifest">
