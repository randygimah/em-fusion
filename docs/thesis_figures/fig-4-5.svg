<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="760" height="440" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The decision ladder. Off-normal readings enter at the top: a channel more than 6 dB above its receiver&#x27;s own baseline for at least 10 seconds. Rung 1 asks whether one receiver is off-normal while its neighbours are normal; if so, a sensor fault is reported. Rung 2, drawn dashed because it was not built, would ask whether aircraft drop out with no radio anomaly nearby. Rung 3 asks whether several receivers are off-normal together in one zone; if so, a possible interference zone is reported. Otherwise nothing is reported, and the pass records that it looked. The rungs are asked in a fixed order and the first to claim a zone wins." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah45" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <rect x="170" y="12" width="300" height="58" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="320" y="30.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Off-normal readings</text>
  <text x="320" y="47" text-anchor="middle" font-size="10.5" fill="#444444">a channel more than 6 dB above its receiver&#x27;s</text>
  <text x="320" y="60.5" text-anchor="middle" font-size="10.5" fill="#444444">own baseline, for at least 10 s</text>
  <path d="M320,70 L320,97" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <rect x="170" y="98" width="300" height="64" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="320" y="118.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">1. One receiver off-normal,</text>
  <text x="320" y="133.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">its neighbours normal?</text>
  <text x="320" y="150.25" text-anchor="middle" font-size="10.5" fill="#444444">the sensor fault rule</text>
  <path d="M470,130 L539,130" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <text x="505" y="124" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">yes</text>
  <rect x="540" y="98" width="210" height="64" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <text x="645" y="126.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Sensor fault</text>
  <text x="645" y="142.75" text-anchor="middle" font-size="10.5" fill="#444444">that receiver is broken</text>
  <path d="M320,162 L320,189" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <text x="328" y="180" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">no</text>
  <rect x="170" y="190" width="300" height="64" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="320" y="210.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777">2. Aircraft dropping out, with no</text>
  <text x="320" y="225.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777">radio anomaly nearby?</text>
  <text x="320" y="242.25" text-anchor="middle" font-size="10.5" fill="#777777">not built</text>
  <path d="M470,222 L539,222" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ah45)"/>
  <text x="505" y="216" text-anchor="middle" font-size="10.5" font-style="italic" fill="#777777">yes</text>
  <rect x="540" y="190" width="210" height="64" fill="#ffffff" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="645" y="218.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#777777">Source gap</text>
  <text x="645" y="234.75" text-anchor="middle" font-size="10.5" fill="#777777">we are not hearing aircraft here</text>
  <path d="M320,254 L320,281" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <text x="328" y="272" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">no</text>
  <rect x="170" y="282" width="300" height="64" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="320" y="302.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">3. Several receivers off-normal</text>
  <text x="320" y="317.75" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">together, in one zone?</text>
  <text x="320" y="334.25" text-anchor="middle" font-size="10.5" fill="#444444">the fusion rule</text>
  <path d="M470,314 L539,314" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <text x="505" y="308" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">yes</text>
  <rect x="540" y="282" width="210" height="64" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <text x="645" y="303.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Possible interference zone</text>
  <text x="645" y="320" text-anchor="middle" font-size="10.5" fill="#444444">aircraft evidence attached</text>
  <text x="645" y="333.5" text-anchor="middle" font-size="10.5" fill="#444444">as corroboration where measurable</text>
  <path d="M320,346 L320,373" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah45)"/>
  <text x="328" y="364" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">no</text>
  <rect x="170" y="374" width="300" height="52" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <text x="320" y="396.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Nothing reported</text>
  <text x="320" y="412.75" text-anchor="middle" font-size="10.5" fill="#444444">the pass records that it looked</text>
  <path d="M150,104 L150,340" fill="none" stroke="#555555" stroke-width="1.1" marker-end="url(#ah45)"/>
  <text x="140" y="140" text-anchor="end" font-size="10.5" fill="#444444">Asked in a</text>
  <text x="140" y="155" text-anchor="end" font-size="10.5" fill="#444444">fixed order.</text>
  <text x="140" y="170" text-anchor="end" font-size="10.5" fill="#444444">The first rung</text>
  <text x="140" y="185" text-anchor="end" font-size="10.5" fill="#444444">to claim a zone</text>
  <text x="140" y="200" text-anchor="end" font-size="10.5" fill="#444444">wins; a lower</text>
  <text x="140" y="215" text-anchor="end" font-size="10.5" fill="#444444">claim on that</text>
  <text x="140" y="230" text-anchor="end" font-size="10.5" fill="#444444">zone is kept</text>
  <text x="140" y="245" text-anchor="end" font-size="10.5" fill="#444444">as superseded,</text>
  <text x="140" y="260" text-anchor="end" font-size="10.5" fill="#444444">never as</text>
  <text x="140" y="275" text-anchor="end" font-size="10.5" fill="#444444">evidence.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
