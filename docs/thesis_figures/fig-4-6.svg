<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="The hypothesis layer. An evidence bundle is reduced to what may leave the machine, sent to the hosted AI model under a JSON schema at temperature 0, then checked for form and for grounding before the hypothesis is stored. A malformed or ungrounded reply is retried, up to two attempts in all; if the second is also refused, the template generator writes the hypothesis instead and the reason is recorded. If the provider cannot be reached, the call is counted against the budget and not retried, and the bundle is shown with no hypothesis." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah46" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <rect x="6" y="40" width="112" height="70" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="62" y="64.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Evidence</text>
  <text x="62" y="79.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">bundle</text>
  <text x="62" y="94.75" text-anchor="middle" font-size="10" fill="#444444">one reported claim</text>
  <rect x="133" y="40" width="112" height="70" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="189" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">What leaves</text>
  <text x="189" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">the machine</text>
  <text x="189" y="88.5" text-anchor="middle" font-size="10" fill="#444444">pseudonyms only,</text>
  <text x="189" y="101" text-anchor="middle" font-size="10" fill="#444444">no positions</text>
  <rect x="260" y="40" width="112" height="70" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <text x="316" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Hosted</text>
  <text x="316" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">AI model</text>
  <text x="316" y="88.5" text-anchor="middle" font-size="10" fill="#444444">schema-constrained,</text>
  <text x="316" y="101" text-anchor="middle" font-size="10" fill="#444444">temperature 0</text>
  <rect x="387" y="40" width="112" height="70" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="443" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Schema</text>
  <text x="443" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">check</text>
  <text x="443" y="88.5" text-anchor="middle" font-size="10" fill="#444444">is the reply</text>
  <text x="443" y="101" text-anchor="middle" font-size="10" fill="#444444">well formed?</text>
  <rect x="514" y="40" width="112" height="70" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="570" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Grounding</text>
  <text x="570" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">check</text>
  <text x="570" y="88.5" text-anchor="middle" font-size="10" fill="#444444">does each citation</text>
  <text x="570" y="101" text-anchor="middle" font-size="10" fill="#444444">exist in the bundle?</text>
  <rect x="641" y="40" width="112" height="70" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="697" y="58" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Stored</text>
  <text x="697" y="73" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">hypothesis</text>
  <text x="697" y="88.5" text-anchor="middle" font-size="10" fill="#444444">appended, with model,</text>
  <text x="697" y="101" text-anchor="middle" font-size="10" fill="#444444">settings and raw reply</text>
  <path d="M118,75 L132,75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <path d="M245,75 L259,75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <path d="M372,75 L386,75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <path d="M499,75 L513,75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <path d="M626,75 L640,75" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="316" y="28" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">outside the machine</text>
  <path d="M443,110 L443,151" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <path d="M570,110 L570,151" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="437" y="136" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">malformed</text>
  <text x="576" y="136" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">ungrounded</text>
  <rect x="397" y="152" width="203" height="46" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="498.5" y="171.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Refused: try again</text>
  <text x="498.5" y="187.75" text-anchor="middle" font-size="10.5" fill="#444444">up to two attempts in all</text>
  <path d="M397,175 L338,175 L338,111" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="367.5" y="169" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">attempt 2</text>
  <path d="M498.5,198 L498.5,249" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="506.5" y="224" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">second attempt also refused</text>
  <rect x="397" y="250" width="203" height="46" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="498.5" y="269.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Template generator</text>
  <text x="498.5" y="285.75" text-anchor="middle" font-size="10.5" fill="#444444">writes it instead; reason recorded</text>
  <path d="M600,273 L697,273 L697,111" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="691" y="160" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">also</text>
  <text x="691" y="174" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">grounding-</text>
  <text x="691" y="188" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">checked,</text>
  <text x="691" y="202" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">then stored</text>
  <path d="M294,110 L294,249" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <text x="288" y="136" text-anchor="end" font-size="10.5" font-style="italic" fill="#444444">unreachable</text>
  <rect x="153" y="250" width="210" height="46" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="258" y="269.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">Provider unreachable</text>
  <text x="258" y="285.75" text-anchor="middle" font-size="10" fill="#444444">counted against the budget, not retried</text>
  <path d="M258,296 L258,339" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah46)"/>
  <rect x="153" y="340" width="210" height="46" fill="#ffffff" stroke="#333333" stroke-width="1"/>
  <text x="258" y="359.25" text-anchor="middle" font-size="12" font-weight="bold" fill="#111111">No hypothesis</text>
  <text x="258" y="375.75" text-anchor="middle" font-size="10.5" fill="#444444">the bundle is shown unexplained</text>
  <rect x="6" y="400" width="18" height="12" fill="#f0f0f0" stroke="#333333" stroke-width="1"/>
  <text x="30" y="410" text-anchor="start" font-size="10.5" fill="#444444">outside the machine</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
