<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Layout of the Operational Picture. A narrow navigation rail on the left holds the three screens, the data-mode badge and the system status. A top bar names the run and the data, with the hour chooser and the view switch. The offline map fills the centre and is read first; the exception panel, docked beneath it with tabs for radio, tracks and events, is read second; the right rail, holding hypothesis cards and the detection summary, is read third; the evidence panel, one scroll down, is read last." xmlns:c2pa="http://c2pa.org/manifest">
