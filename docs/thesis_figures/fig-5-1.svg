  <text x="433" y="95" text-anchor="middle" font-size="10" fill="#444444">8</text>
  <rect x="456" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="475" y="95" text-anchor="middle" font-size="10" fill="#444444">9</text>
  <rect x="498" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="517" y="95" text-anchor="middle" font-size="10" fill="#444444">10</text>
  <rect x="540" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="559" y="95" text-anchor="middle" font-size="10" fill="#444444">11</text>
  <rect x="582" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="601" y="95" text-anchor="middle" font-size="10" fill="#444444">12</text>
  <rect x="634" y="44" width="16" height="32" fill="#111111"/>
  <text x="656" y="58" text-anchor="start" font-size="10.5" font-weight="bold" fill="#111111">completion</text>
  <text x="656" y="72" text-anchor="start" font-size="10.5" fill="#444444">stamp written</text>
  <text x="20" y="158" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Interrupted run</text>
  <text x="20" y="173" text-anchor="start" font-size="10.5" fill="#444444">stored batches stay</text>
  <rect x="120" y="140" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="139" y="195" text-anchor="middle" font-size="10" fill="#444444">1</text>
  <rect x="162" y="140" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
