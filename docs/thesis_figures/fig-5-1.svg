<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two runs of the replayed hour, each drawn as twelve five-minute batches. In a completed run all twelve batches are stored and a completion stamp is written after the last one. In an interrupted run the first six batches are stored, the seventh fails, the remaining five never run, and no completion stamp is written, so the six stored batches stay in the store and the run reads as unfinished." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah51" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="330" fill="#ffffff"/>
  <text x="20" y="58" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Completed run</text>
  <text x="20" y="73" text-anchor="start" font-size="10.5" fill="#444444">every batch stored</text>
  <rect x="120" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="139" y="95" text-anchor="middle" font-size="10" fill="#444444">1</text>
  <rect x="162" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
