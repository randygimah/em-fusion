  <text x="656" y="158" text-anchor="start" font-size="10.5" font-weight="bold" fill="#111111">no stamp:</text>
  <text x="656" y="172" text-anchor="start" font-size="10.5" fill="#444444">reads as unfinished</text>
  <line x1="120" y1="222" x2="620" y2="222" stroke="#333333" stroke-width="1"/>
  <line x1="120" y1="222" x2="120" y2="227" stroke="#333333" stroke-width="1"/>
  <text x="120" y="241" text-anchor="middle" font-size="10" fill="#444444">0 min</text>
  <line x1="244" y1="222" x2="244" y2="227" stroke="#333333" stroke-width="1"/>
  <text x="244" y="241" text-anchor="middle" font-size="10" fill="#444444">15 min</text>
  <line x1="370" y1="222" x2="370" y2="227" stroke="#333333" stroke-width="1"/>
  <text x="370" y="241" text-anchor="middle" font-size="10" fill="#444444">30 min</text>
  <line x1="496" y1="222" x2="496" y2="227" stroke="#333333" stroke-width="1"/>
  <text x="496" y="241" text-anchor="middle" font-size="10" fill="#444444">45 min</text>
  <line x1="620" y1="222" x2="620" y2="227" stroke="#333333" stroke-width="1"/>
  <text x="620" y="241" text-anchor="middle" font-size="10" fill="#444444">60 min</text>
  <text x="370" y="262" text-anchor="middle" font-size="10.5" fill="#444444">The replayed hour, in five-minute batches, each stored all or nothing</text>
  <rect x="20" y="282" width="18" height="12" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="44" y="292" text-anchor="start" font-size="10.5" fill="#444444">stored</text>
  <rect x="110" y="282" width="18" height="12" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <path d="M113,284 L125,292 M125,284 L113,292" stroke="#111111" stroke-width="1.3"/>
  <text x="134" y="292" text-anchor="start" font-size="10.5" fill="#444444">failed, nothing from it stored</text>
  <rect x="330" y="282" width="18" height="12" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="354" y="292" text-anchor="start" font-size="10.5" fill="#444444">never run</text>
  <text x="20" y="318" text-anchor="start" font-size="10" font-style="italic" fill="#444444">One batch is one database transaction. The run as a whole is not: a reader must check the stamp, not assume a failed run wrote nothing.</text>
