  <text x="307" y="195" text-anchor="middle" font-size="10" fill="#444444">5</text>
  <rect x="330" y="140" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="349" y="195" text-anchor="middle" font-size="10" fill="#444444">6</text>
  <rect x="372" y="140" width="38" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <path d="M382,150 L400,170 M400,150 L382,170" stroke="#111111" stroke-width="1.6"/>
  <text x="391" y="195" text-anchor="middle" font-size="10" fill="#444444">7</text>
  <rect x="414" y="140" width="38" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="433" y="195" text-anchor="middle" font-size="10" fill="#444444">8</text>
  <rect x="456" y="140" width="38" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="475" y="195" text-anchor="middle" font-size="10" fill="#444444">9</text>
  <rect x="498" y="140" width="38" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="517" y="195" text-anchor="middle" font-size="10" fill="#444444">10</text>
  <rect x="540" y="140" width="38" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="559" y="195" text-anchor="middle" font-size="10" fill="#444444">11</text>
  <rect x="582" y="140" width="38" height="40" fill="#ffffff" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="601" y="195" text-anchor="middle" font-size="10" fill="#444444">12</text>
