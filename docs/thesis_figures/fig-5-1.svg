  <text x="307" y="95" text-anchor="middle" font-size="10" fill="#444444">5</text>
  <rect x="330" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
  <text x="349" y="95" text-anchor="middle" font-size="10" fill="#444444">6</text>
  <rect x="372" y="40" width="38" height="40" fill="#d9d9d9" stroke="#333333" stroke-width="1"/>
