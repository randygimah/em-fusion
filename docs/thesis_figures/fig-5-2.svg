<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two aircraft reports from the archive drawn on a time axis ending at the moment of the report. For a nominal aircraft, the last contact and the last position update both sit at the present, so both staleness values are near zero. For the degraded record, the aircraft was heard 1.35 seconds before the report but its position was last updated 209 seconds before, so the two values diverge by more than three minutes. Carrying only one of them would make this aircraft look like one that had dropped off the network." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah52" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="20" y="74" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Nominal report</text>
  <text x="20" y="89" text-anchor="start" font-size="10.5" fill="#444444">both clocks at the present</text>
  <line x1="150" y1="70" x2="700" y2="70" stroke="#bbbbbb" stroke-width="1"/>
  <rect x="691.6" y="64" width="12" height="12" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <circle cx="700.0" cy="70" r="6" fill="#111111"/>
  <line x1="700" y1="56" x2="700" y2="84" stroke="#111111" stroke-width="1.4"/>
  <text x="686" y="92" text-anchor="end" font-size="10.5" fill="#444444">contact 0.00 s, position 1.06 s</text>
  <text x="20" y="174" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Degraded report</text>
  <text x="20" y="189" text-anchor="start" font-size="10.5" fill="#444444">airborne, 10,607 m</text>
  <line x1="150" y1="170" x2="700" y2="170" stroke="#bbbbbb" stroke-width="1"/>
  <rect x="221.0" y="164" width="475.9" height="12" fill="#e6e6e6" stroke="none"/>
  <text x="458.974" y="158" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">209 s between the two clocks</text>
  <rect x="215.0" y="164" width="12" height="12" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <circle cx="696.9" cy="170" r="6" fill="#111111"/>
  <line x1="700" y1="156" x2="700" y2="184" stroke="#111111" stroke-width="1.4"/>
  <text x="211.042" y="196" text-anchor="start" font-size="10.5" fill="#444444">position last updated 209 s ago</text>
  <text x="682.906" y="196" text-anchor="end" font-size="10.5" fill="#444444">heard 1.35 s ago</text>
  <line x1="150" y1="226" x2="700" y2="226" stroke="#333333" stroke-width="1"/>
  <line x1="150.0" y1="226" x2="150.0" y2="231" stroke="#333333" stroke-width="1"/>
  <text x="150" y="245" text-anchor="middle" font-size="10" fill="#444444">240 s before</text>
  <line x1="287.5" y1="226" x2="287.5" y2="231" stroke="#333333" stroke-width="1"/>
  <text x="287.5" y="245" text-anchor="middle" font-size="10" fill="#444444">180 s before</text>
  <line x1="425.0" y1="226" x2="425.0" y2="231" stroke="#333333" stroke-width="1"/>
  <text x="425" y="245" text-anchor="middle" font-size="10" fill="#444444">120 s before</text>
  <line x1="562.5" y1="226" x2="562.5" y2="231" stroke="#333333" stroke-width="1"/>
  <text x="562.5" y="245" text-anchor="middle" font-size="10" fill="#444444">60 s before</text>
  <line x1="700.0" y1="226" x2="700.0" y2="231" stroke="#333333" stroke-width="1"/>
  <text x="700" y="245" text-anchor="middle" font-size="10" fill="#444444">report</text>
  <circle cx="26" cy="276" r="6" fill="#111111"/>
  <text x="38" y="280" text-anchor="start" font-size="10.5" fill="#444444">last contact: when the aircraft was last heard at all</text>
  <rect x="380" y="270" width="12" height="12" fill="#ffffff" stroke="#111111" stroke-width="1.6"/>
  <text x="398" y="280" text-anchor="start" font-size="10.5" fill="#444444">last position update: how old the coordinate is</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
