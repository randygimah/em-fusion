<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Two timelines of aircraft reports. Top, a gap in reporting: reports arrive, stop, and resume; the finding&#x27;s window runs from the last report before the silence to the first report after it, and both ends are stored reports, so the window and the citation coincide. Bottom, a frozen position: reports keep arriving but the position in them stops advancing. The window starts at the moment the position was last fresh, worked out by subtracting the staleness the first stale report declares; nothing was recorded at that instant. The citation used to point there and found nothing; it now points at the first and last reports the rule read." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ah53" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="380" fill="#ffffff"/>
  <text x="20" y="94" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Gap in reporting</text>
  <text x="20" y="109" text-anchor="start" font-size="10.5" fill="#444444">the aircraft goes silent</text>
  <line x1="150" y1="90" x2="720" y2="90" stroke="#bbbbbb" stroke-width="1"/>
  <rect x="175" y="85" width="10" height="10" fill="#111111"/>
  <rect x="215" y="85" width="10" height="10" fill="#111111"/>
  <rect x="255" y="85" width="10" height="10" fill="#111111"/>
  <rect x="295" y="85" width="10" height="10" fill="#111111"/>
  <rect x="555" y="85" width="10" height="10" fill="#111111"/>
  <rect x="595" y="85" width="10" height="10" fill="#111111"/>
  <rect x="635" y="85" width="10" height="10" fill="#111111"/>
  <rect x="675" y="85" width="10" height="10" fill="#111111"/>
  <line x1="306" y1="90" x2="554" y2="90" stroke="#777777" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="430" y="108" text-anchor="middle" font-size="10.5" font-style="italic" fill="#444444">silence: nothing received</text>
  <path d="M300,70 V64 H560 V70" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="430" y="58" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">window: what the rule concluded</text>
  <path d="M300,124 L300,100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah53)"/>
  <path d="M560,124 L560,100" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah53)"/>
  <text x="430" y="134" text-anchor="middle" font-size="10.5" fill="#444444">cited: the two reports either side, both stored</text>
  <text x="20" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#111111">Frozen position</text>
  <text x="20" y="269" text-anchor="start" font-size="10.5" fill="#444444">still heard, position not advancing</text>
  <line x1="150" y1="250" x2="720" y2="250" stroke="#bbbbbb" stroke-width="1"/>
  <rect x="175" y="245" width="10" height="10" fill="#111111"/>
  <rect x="215" y="245" width="10" height="10" fill="#111111"/>
  <rect x="395" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="435" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="475" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="515" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="555" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="595" y="245" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <rect x="645" y="245" width="10" height="10" fill="#111111"/>
  <rect x="685" y="245" width="10" height="10" fill="#111111"/>
  <rect x="300" y="245" width="10" height="10" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <rect x="345" y="245" width="10" height="10" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <circle cx="260" cy="250" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="3 2"/>
  <path d="M260,262 V326 H266" fill="none" stroke="#777777" stroke-width="1"/>
  <text x="270" y="330" text-anchor="start" font-size="10.5" font-style="italic" fill="#444444">old citation: the reconstructed start, where nothing was stored</text>
  <path d="M400,236 L269,236" fill="none" stroke="#777777" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ah53)"/>
  <text x="330" y="230" text-anchor="middle" font-size="10" font-style="italic" fill="#444444">minus the declared staleness</text>
  <path d="M260,210 V204 H600 V210" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="430" y="198" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#111111">window: from when the position was last fresh</text>
  <path d="M400,284 L400,260" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah53)"/>
  <path d="M600,284 L600,260" fill="none" stroke="#333333" stroke-width="1.2" marker-end="url(#ah53)"/>
  <text x="500" y="300" text-anchor="middle" font-size="10.5" fill="#444444">cited now: the first and last stale reports read</text>
  <rect x="20" y="358" width="10" height="10" fill="#111111"/>
  <text x="36" y="368" text-anchor="start" font-size="10.5" fill="#444444">report, position fresh</text>
  <rect x="190" y="358" width="10" height="10" fill="#9a9a9a" stroke="#333333" stroke-width="1"/>
  <text x="206" y="368" text-anchor="start" font-size="10.5" fill="#444444">position stale past 100 s, contact fresh</text>
  <rect x="460" y="358" width="10" height="10" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="476" y="368" text-anchor="start" font-size="10.5" fill="#444444">position stopped, not yet past 100 s</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
