server {
    # Unprivileged port: nginx runs as a non-root user and cannot bind below 1024.
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # map-001. The map's worker ships as an .mjs file, which this nginx's type
    # map does not know, and a browser refuses to run a module worker served as
    # application/octet-stream -- the map would start, credit its sources and
    # draw nothing. An empty `types` drops the inherited map for this location
    # only, so default_type applies.
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        types { }
        default_type text/javascript;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
    
    location /api/ {
        # No trailing slash: the backend owns the full /api/v1 path, so the
        # prefix must pass through rather than being stripped here.
        proxy_pass http://backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
